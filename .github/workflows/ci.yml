name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Анализ и тесты (с настоящим API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pulsar
          POSTGRES_USER: pulsar
          POSTGRES_PASSWORD: pulsar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsar" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mench0/pulsar-tax
          # API на Spring Boot пока в ветке spring-boot; после слияния в master — заменить на master.
          ref: spring-boot
          path: api
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Собрать API
        working-directory: api/pulsar
        run: ./mvnw -B -q -DskipTests package
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Тесты
        run: flutter test
        env:
          PULSAR_JAR: ${{ github.workspace }}/api/pulsar/target/pulsar-tax.jar
          PULSAR_DB_URL: jdbc:postgresql://localhost:5432/pulsar
          PULSAR_DB_USER: pulsar
          PULSAR_DB_PASSWORD: pulsar

  web:
    name: Сборка веб
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

  android:
    name: Сборка Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    name: Сборка iOS (без подписи)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign
